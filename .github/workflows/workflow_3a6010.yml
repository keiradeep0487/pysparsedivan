name: Build Pipeline
on:
  workflow_dispatch:

  schedule:
    - cron: '35 1,7,13,19 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
